# Dependências da versão publicada no Streamlit Community Cloud.
#
# Por que este arquivo existe, e não apenas packages.txt: o Community Cloud
# roda Debian 11 (bullseye), cujo apt oferece Tesseract 4.1.1 — uma geração
# anterior do motor, com resultados diferentes dos obtidos localmente. O
# conda-forge tem a 5.5.3, a mais recente, para linux-64 e osx-arm64.
#
# A parte conda é de propósito mínima: só o motor. Todo o resto vem do pip,
# igual a requirements.txt. Ambientes conda grandes falham com frequência no
# Community Cloud (o solver trava ou o processo é morto por falta de memória),
# e um único pacote mantém a resolução curta.
#
# A versão de Python não é fixada aqui: quem escolhe é a configuração do app
# no Community Cloud, e fixá-la faria o conda tentar trocar o Python do
# ambiente base durante o deploy.
channels:
  - conda-forge
dependencies:
  - tesseract=5.5.3
  - pip
  - pip:
      # O pacote conda do Tesseract não traz modelos de idioma; este traz.
      - tessdata.eng==1.0.0
      - opencv-python-headless>=4.10,<5
      - numpy>=2,<3
      - pytesseract>=0.3.13,<0.4
      - streamlit>=1.50,<2
      - Pillow>=10,<13
